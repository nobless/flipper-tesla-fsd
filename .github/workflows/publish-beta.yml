name: Publish beta
run-name: Publish ${{ inputs.version || 'requested beta' }}

on:
  push:
    branches: [main]
    paths: ['.github/beta-release-version']
  workflow_dispatch:
    inputs:
      version:
        description: 'New beta tag, for example v2.17-beta.9'
        required: true
        default: v2.17-beta.9
        type: string

permissions:
  contents: read

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and check tag is unused
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then VERSION=$(cat .github/beta-release-version); fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?-beta\.[0-9]+$ ]] || {
            echo "::error::Use a beta version such as v2.17-beta.9"; exit 1;
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" > tags.json
          if jq -e --arg ref "refs/tags/$VERSION" 'any(.[]; .ref == $ref)' tags.json >/dev/null; then
            echo "::error::Tag already exists; choose a new version"; exit 1
          fi
      - name: Host tests
        run: make -C test check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            esp32/.pio
          key: pio-lilygo-t2can-fd-${{ hashFiles('esp32/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build diagnostic firmware
        working-directory: esp32
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e lilygo-t2can-fd-spi-diag -e lilygo-t2can-fd-spi-lilygo -e lilygo-t2can-fd-spi-longan
      - name: Verify embedded version in every image
        working-directory: esp32
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ("diag", "lilygo", "longan"):
              image = Path(f".pio/build/lilygo-t2can-fd-spi-{name}/firmware.bin")
              if os.environ["FW_VERSION"].encode() + b"\\0" not in image.read_bytes():
                  raise SystemExit(f"Missing release version in {image}")
          PY
      - name: Check stack budget
        working-directory: esp32
        run: |
          python3 diagnostics/check_stack.py .pio/build/lilygo-t2can-fd-spi-diag
          python3 diagnostics/check_stack.py .pio/build/lilygo-t2can-fd-spi-lilygo
          python3 diagnostics/check_stack.py .pio/build/lilygo-t2can-fd-spi-longan
      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp esp32/.pio/build/lilygo-t2can-fd-spi-diag/firmware.bin release/tesla-fsd-lilygo-t2can-fd.bin
          cp esp32/.pio/build/lilygo-t2can-fd-spi-diag/firmware-merged.bin release/tesla-fsd-lilygo-t2can-fd-merged.bin
          for provider in lilygo longan; do
            cp esp32/.pio/build/lilygo-t2can-fd-spi-$provider/firmware-merged.bin release/tesla-fsd-lilygo-t2can-fd-$provider-merged.bin
          done
          cp esp32/diagnostics/README.md release/DIAGNOSTICS.md
          cp docs/install/index.html release/tesla-flasher.html
      - uses: actions/upload-artifact@v6
        with:
          name: beta-firmware
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: beta-firmware
          path: release
      - name: Create beta release with tested firmware
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" \
            --prerelease --title "$VERSION" \
            --notes "Standalone LilyGO T-2CAN FD SPI diagnostics; no dashboard, WiFi, storage or TWAI. Default image tests hardware/software SPI modes 0/3, MISO pulls during reads, reset delays, configuration and RAM verification. Additional lilygo/longan images compare pinned upstream drivers in Configuration mode. See DIAGNOSTICS.md for serial commands. Disconnect the vehicle and use USB power. Hardware operation remains unverified; host tests, all three builds and stack checks passed."
          echo "### Published $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "The pages workflow will deploy the firmware to the installer." >> "$GITHUB_STEP_SUMMARY"
