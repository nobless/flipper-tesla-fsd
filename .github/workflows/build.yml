name: build

# Builds the Flipper .fap and every ESP32 firmware variant on each push, PR,
# and tag. Tag pushes (v*) also attach all artifacts to the GitHub Release so
# testers can download a coherent build without a local toolchain.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Beta version to publish'
        required: true
        default: 'v2.17-beta.5'
        type: string

permissions:
  contents: write   # needed to create/upload beta releases

jobs:
  host-tests:
    name: Host unit tests (protocol core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run protocol-core tests
        run: make -C test check

  esp32-matrix:
    name: ESP32 ${{ matrix.env }}
    needs: [host-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - lilygo-t2can-fd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esp32/.pio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        working-directory: esp32
        env:
          FW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: pio run -e ${{ matrix.env }}
      # Loop-task call chains vs. the loop task's stack size, from the .su
      # files the build just wrote. Fails before anything is staged or uploaded.
      - name: Check loop-task stack budget
        working-directory: esp32
        run: python3 ci_check_stack.py ".pio/build/${{ matrix.env }}"
      - name: Stage firmware
        working-directory: esp32
        run: |
          mkdir -p out
          # App-only image — for the in-device OTA updater (dashboard upload).
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "out/tesla-fsd-${{ matrix.env }}.bin"
          # Full-flash merged image (offset 0) — for the browser flasher on a blank board.
          cp ".pio/build/${{ matrix.env }}/firmware-merged.bin" "out/tesla-fsd-${{ matrix.env }}-merged.bin"
          test -f "out/tesla-fsd-${{ matrix.env }}.bin"
          test -f "out/tesla-fsd-${{ matrix.env }}-merged.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.env }}
          path: esp32/out/*.bin
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    needs: [esp32-matrix]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + rename
        run: |
          mkdir -p release
          find artifacts -name '*.fap' -exec cp {} release/ \;
          find artifacts -name '*.bin' -exec cp {} release/ \;
          # Self-contained browser flasher — download it and open in Chrome/Edge
          # to flash without hosting anything.
          cp docs/install/index.html release/tesla-flasher.html
          ls -la release
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes 'LilyGo T-2CAN FD MCP2518FD SPI diagnostics'
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
